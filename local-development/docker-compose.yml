services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-plsql-lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
